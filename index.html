<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="keywords" content="redchesss, chess, play chess online, chess game">
  <meta name="google-site-verification" content="Xcy_X2z73e1Khm-4lgwmyLaYKD_7-I_Qe9j8XIIlpR0" />
  <meta name="description" content="RedChess brings chess to life with stunning visuals, fluid gameplay, and competitive online matches in a fast, modern experience built for every chess player.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Chess</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#010203">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes crownFloat  { 0%,100%{transform:translateY(0)}  50%{transform:translateY(-9px)} }
    @keyframes splashPulse { 0%,100%{opacity:.55;box-shadow:0 0 0 rgba(201,168,76,0)} 50%{opacity:1;box-shadow:0 0 28px rgba(201,168,76,.18)} }
    @keyframes fadeUp      { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn      { from{opacity:0} to{opacity:1} }
    @keyframes barGrow     { from{width:0} to{width:clamp(100px,22vw,180px)} }
    @keyframes bracketIn   { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
  </style>
</head>
<body>

  <canvas id="c"></canvas>
  <div class="glow"></div>
  <div class="content">

    <span class="eyebrow">The Royal Game</span>

    <div class="pieces-row" aria-hidden="true">
      <span class="pr-piece">♜</span>
      <span class="pr-piece">♛</span>
      <span class="pr-piece">♚</span>
      <span class="pr-piece">♝</span>
      <span class="pr-piece">♞</span>
    </div>

    <div class="title-wrap">
      <h1>Red Chess</h1>
      <p class="tagline">Every move tells a story</p>
    </div>

    <div class="rule" role="separator">
      <div class="rl"></div><div class="rd"></div><div class="rr"></div>
    </div>

    <nav class="menu" aria-label="Main menu">
      <button class="menu-btn primary" onclick="window.location.href='./play/bot-select.html'">♟ &nbsp; Play</button>
      <button class="menu-btn sec"     onclick="window.location.href='./analysis/analysis.html'">⊹ &nbsp; Analysis</button>
      <button class="menu-btn sec"     onclick="window.location.href='./settings/settings.html'">⚙ &nbsp; Settings</button>
    </nav>

  </div>

  <div class="ver">
    <span>
      Red Chess &nbsp;·&nbsp; v1.0
      &nbsp;&nbsp;
      <a href="./about.html" style="color:inherit;opacity:0.5;text-decoration:none;font-size:0.75em;letter-spacing:0.08em;">About</a>
      &nbsp;·&nbsp;
      <a href="./privacy-policy.html" style="color:inherit;opacity:0.5;text-decoration:none;font-size:0.75em;letter-spacing:0.08em;">Privacy Policy</a>
    </span>
  </div>

  <!-- Background music -->
  <audio id="bgMusic" loop>
    <source src="sounds/Aftertherain.mp3" type="audio/mpeg">
  </audio>

  <!-- ═══════════ SPLASH ═══════════ -->
  <div id="splash" style="
    position:fixed;inset:0;z-index:9999;
    background:#080806;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
    transition:opacity 1s ease;
    overflow:hidden;
  ">

    <!-- top/bottom gold lines -->
    <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.65) 30%,#c9a84c 50%,rgba(201,168,76,.65) 70%,transparent);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.65) 30%,#c9a84c 50%,rgba(201,168,76,.65) 70%,transparent);"></div>

    <!-- corner brackets -->
    <div style="position:absolute;top:1.4rem;left:1.4rem;width:3.2rem;height:3.2rem;border-top:1px solid rgba(201,168,76,.5);border-left:1px solid rgba(201,168,76,.5);animation:bracketIn .7s .2s ease both;"></div>
    <div style="position:absolute;top:1.4rem;right:1.4rem;width:3.2rem;height:3.2rem;border-top:1px solid rgba(201,168,76,.5);border-right:1px solid rgba(201,168,76,.5);animation:bracketIn .7s .3s ease both;"></div>
    <div style="position:absolute;bottom:1.4rem;left:1.4rem;width:3.2rem;height:3.2rem;border-bottom:1px solid rgba(201,168,76,.5);border-left:1px solid rgba(201,168,76,.5);animation:bracketIn .7s .4s ease both;"></div>
    <div style="position:absolute;bottom:1.4rem;right:1.4rem;width:3.2rem;height:3.2rem;border-bottom:1px solid rgba(201,168,76,.5);border-right:1px solid rgba(201,168,76,.5);animation:bracketIn .7s .5s ease both;"></div>

    <!-- subtle red centre glow -->
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 50% 50%,rgba(160,20,20,.13) 0%,transparent 70%);pointer-events:none;"></div>

    <!-- crown -->
    <div style="
      font-size:clamp(3.2rem,8vw,5rem);
      color:#c9a84c;
      line-height:1;
      margin-bottom:.6rem;
      filter:drop-shadow(0 0 22px rgba(201,168,76,.5));
      animation:crownFloat 3.8s ease-in-out infinite, fadeIn .8s .1s ease both;
    ">&#9818;</div>

    <!-- title -->
    <div style="
      font-family:'Cinzel',serif;font-weight:900;
      font-size:clamp(2.6rem,7.5vw,4.8rem);
      letter-spacing:.2em;line-height:1;
      background:linear-gradient(175deg,#f2dc90 0%,#c9a84c 50%,#7a5e18 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:.35em;
      animation:fadeUp .8s .25s ease both;
    ">RED CHESS</div>

    <!-- red accent bar -->
    <div style="
      height:1.5px;
      background:linear-gradient(90deg,transparent,#b02020,#e03030,#b02020,transparent);
      box-shadow:0 0 10px rgba(190,40,40,.55);
      margin-bottom:1.1rem;
      animation:barGrow .9s .7s ease both;
    "></div>

    <!-- tagline -->
    <div style="
      font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;
      color:rgba(201,168,76,.45);
      font-size:clamp(.88rem,2.4vw,1.1rem);
      letter-spacing:.22em;
      margin-bottom:2.6rem;
      animation:fadeUp .8s .55s ease both;
    ">Every move tells a story</div>

    <!-- divider -->
    <div style="display:flex;align-items:center;gap:.9rem;margin-bottom:2.4rem;animation:fadeIn .8s .85s ease both;">
      <div style="width:clamp(60px,11vw,100px);height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4));"></div>
      <div style="width:5px;height:5px;background:#c9a84c;transform:rotate(45deg);box-shadow:0 0 8px rgba(201,168,76,.7);"></div>
      <div style="width:clamp(60px,11vw,100px);height:1px;background:linear-gradient(270deg,transparent,rgba(201,168,76,.4));"></div>
    </div>

    <!-- click to continue -->
    <div style="
      font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;
      font-size:clamp(.82rem,2vw,.98rem);
      letter-spacing:.28em;
      color:rgba(201,168,76,.45);
      animation:splashPulse 2.6s 1.4s ease-in-out infinite, fadeIn .8s 1.1s ease both;
    ">click anywhere to continue</div>

  </div>
  <!-- ═══════════════════════════════ -->

  <button id="musicBtn" aria-label="Toggle music" style="position:fixed;bottom:2.8rem;right:1.2rem;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:1rem;width:2.3rem;height:2.3rem;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,opacity .2s;opacity:.6;z-index:999;padding:0;line-height:1;">&#128266;</button>

  <script>
  (function(){
    var splash = document.getElementById('splash');
    var audio  = document.getElementById('bgMusic');
    var btn    = document.getElementById('musicBtn');
    var muted  = false;

    audio.volume = 0.45;

    // Restore mute preference across pages
    if(sessionStorage.getItem('musicMuted') === '1'){
      muted = true; audio.muted = true;
      btn.innerHTML = '&#128263;'; btn.style.opacity = '0.3';
    }

    function saveMusicState(){
      try{
        sessionStorage.setItem('musicTime',    audio.currentTime.toString());
        sessionStorage.setItem('musicPlaying', (!audio.paused) ? '1' : '0');
        sessionStorage.setItem('musicMuted',   muted ? '1' : '0');
      }catch(e){}
    }

    function enter(instant){
      sessionStorage.setItem('entered','1');

      // Restore playback position if returning from another page
      var t = parseFloat(sessionStorage.getItem('musicTime') || '0');
      if(t > 0){ try{ audio.currentTime = t; }catch(e){} }

      audio.play().catch(function(){});
      btn.style.display = 'flex';

      if(instant){
        splash.style.display = 'none';
      } else {
        splash.style.opacity = '0';
        setTimeout(function(){ splash.style.display = 'none'; }, 1000);
      }

      // Keep saving position while music plays
      setInterval(saveMusicState, 500);
    }

    // Already visited this session — skip splash
    if(sessionStorage.getItem('entered')){
      enter(true);
    }

    // Click ANYWHERE on splash to enter
    splash.addEventListener('click', function(){ enter(false); });

    // Save before navigating away
    window.addEventListener('pagehide',     saveMusicState);
    window.addEventListener('beforeunload', saveMusicState);

    // Music toggle button
    btn.addEventListener('click', function(){
      muted = !muted; audio.muted = muted;
      btn.innerHTML = muted ? '&#128263;' : '&#128266;';
      btn.style.opacity = muted ? '0.3' : '0.6';
      saveMusicState();
    });
    btn.addEventListener('mouseenter', function(){ btn.style.opacity='1'; btn.style.background='rgba(201,168,76,.2)'; });
    btn.addEventListener('mouseleave', function(){ btn.style.opacity=muted?'0.3':'0.6'; btn.style.background='rgba(201,168,76,.1)'; });
  })();
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
  </script>
  <script src="script.js"></script>
  <script src="coi-serviceworker.min.js"></script>
  <script src="bganimation.js"></script>
  <script src="server/online.js"></script>
</body>
</html>
